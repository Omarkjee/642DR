[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermostat-rl"
version = "0.1.0"
description = "A reinforcement-learning study of simulated smart thermostat control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0,<2.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=8.0",
]
docs = [
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]
